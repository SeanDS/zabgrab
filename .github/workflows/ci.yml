name: CI

# Every push to this repository's branches runs CI. Pull requests run it too, but
# only from forks: a branch here has already run it on push.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    # Pull requests from this repository's branches already ran CI on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm needs full history and tags to compute the version.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,plot]"
      # The same hooks contributors run on commit (ruff check and format, etc.).
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    # Pull requests from this repository's branches already ran CI on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,plot]"
      # Expected local times in the tests are UK times. Elsewhere the tests set TZ,
      # which Windows ignores.
      - if: runner.os == 'Windows'
        shell: pwsh  # Git Bash would turn /s into a path
        run: tzutil /s "GMT Standard Time"
      # Coverage below 100% fails the run (see [tool.coverage.report]).
      - run: pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          echo "### Coverage: Python ${{ matrix.python-version }}, ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  docs:
    name: Build the documentation
    # Pull requests from this repository's branches already ran CI on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      # Warnings (broken references, bad markup, ...) fail the build.
      - run: sphinx-build --fail-on-warning --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html

  smoke:
    name: Build and smoke test
    # Pull requests from this repository's branches already ran CI on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      # Install the wheel alone in a clean environment, away from the source tree.
      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/zabgrab-*-py3-none-any.whl
      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        run: |
          zabgrab="$RUNNER_TEMP/smoke/bin/zabgrab"
          "$zabgrab" --version
          "$zabgrab" --help
          "$zabgrab" --isolated config show
          "$zabgrab" --isolated config paths
          # Without the plot extra, the plot command still loads.
          "$zabgrab" plot --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
