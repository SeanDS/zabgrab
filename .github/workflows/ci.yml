name: CI

# CI tests pull requests (merged into their base), main and tags. Other branches
# are tested once they have a pull request, or by hand. Pull requests are tested
# themselves, rather than relying on the branch's push run: branch rules only take
# a required check from a run tied to the pull request, and if GitHub drops the
# push event, nothing would report it.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm needs full history and tags to compute the version.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,plot]"
      # The same hooks contributors run on commit (ruff check and format, etc.).
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,plot]"
      # Expected local times in the tests are UK times. Elsewhere the tests set TZ,
      # which Windows ignores.
      - if: runner.os == 'Windows'
        shell: pwsh  # Git Bash would turn /s into a path
        run: tzutil /s "GMT Standard Time"
      # Coverage below 100% fails the run (see [tool.coverage.report]).
      - run: pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          echo "### Coverage: Python ${{ matrix.python-version }}, ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      # Warnings (broken references, bad markup, ...) fail the build.
      - run: sphinx-build --fail-on-warning --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html

  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      # Install the wheel alone in a clean environment, away from the source tree.
      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/zabgrab-*-py3-none-any.whl
      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        run: |
          zabgrab="$RUNNER_TEMP/smoke/bin/zabgrab"
          "$zabgrab" --version
          "$zabgrab" --help
          "$zabgrab" --isolated config show
          "$zabgrab" --isolated config paths
          # Without the plot extra, the plot command still loads.
          "$zabgrab" plot --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  passed:
    # The one check for branch rules to require: it fails unless every job above
    # passed, so the rules needn't change when the jobs do. It runs even when they
    # fail or are cancelled, so it's never skipped (which rules count as passing).
    name: CI passed
    if: always()
    needs: [lint, test, docs, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not every job passed: $RESULTS"
              exit 1
            fi
          done
