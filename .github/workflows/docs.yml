name: Publish documentation

# Publishes the documentation to GitHub Pages for each release. Pages must be set to
# deploy from GitHub Actions (Settings → Pages → Source).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, without cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm needs the tags to give the docs the release's version.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ".[docs]"
      - run: sphinx-build --fail-on-warning --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
