name: Publish documentation

# Publishes the documentation to GitHub Pages (Settings → Pages → Source: GitHub
# Actions):
#
# - the root: the latest release's documentation, built from its tag;
# - /dev/: the development documentation, built from main, with a banner saying so.
#
# Each deployment replaces the whole site, so every run builds both. It runs on
# pushes to main (updating /dev/), when a release is published (updating the root),
# and by hand (always from main). Until the first release, the root redirects to
# /dev/.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, without cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages only accepts deployments from the default branch by default, and a release
  # event runs on its tag, so a release re-runs this workflow on main instead.
  release:
    name: Rebuild for the release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # setuptools_scm needs the history and tags to version each build.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the development documentation (main)
        env:
          ZABGRAB_DOCS_DEVELOPMENT: "1"
        run: |
          python -m venv "$RUNNER_TEMP/dev"
          "$RUNNER_TEMP/dev/bin/pip" install ".[docs]"
          "$RUNNER_TEMP/dev/bin/sphinx-build" --fail-on-warning --keep-going \
            -b html docs "$RUNNER_TEMP/site/dev"

      - name: Build the latest release's documentation
        run: |
          # The latest release, as GitHub shows it (not drafts or pre-releases).
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release yet: the root redirects to the development documentation."
            printf '%s\n' '<!doctype html>' \
              '<meta http-equiv="refresh" content="0; url=dev/">' \
              '<title>zabgrab</title>' \
              '<a href="dev/">zabgrab documentation</a>' \
              > "$RUNNER_TEMP/site/index.html"
            exit 0
          fi
          echo "Building the documentation for $tag."
          git worktree add "$RUNNER_TEMP/release" "$tag"
          python -m venv "$RUNNER_TEMP/rel"
          "$RUNNER_TEMP/rel/bin/pip" install "$RUNNER_TEMP/release[docs]"
          # Released documentation is published as it is, even if it has warnings
          # that a later Sphinx reports.
          "$RUNNER_TEMP/rel/bin/sphinx-build" --keep-going \
            -b html "$RUNNER_TEMP/release/docs" "$RUNNER_TEMP/site.release"
          # The release goes at the root, next to /dev/.
          cp -r "$RUNNER_TEMP/site.release/." "$RUNNER_TEMP/site/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
