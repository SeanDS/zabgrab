[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zabgrab"
description = "Zabbix data retrieval"
readme = "README.md"
authors = [{name = "Sean Leavey", email = "sean.leavey@stfc.ac.uk"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
  "click >=8.2",
  "rich >=13.7",
  "pydantic >=2.11",
  "tomlkit >=0.12",
  "aiohttp >=3.9",
  "keyring >=24",
  "dateparser >=1.2",
]
dynamic = ["version"]

[project.optional-dependencies]
plot = ["matplotlib >=3.8"]
dev = [
  "pytest >=8",
  "pytest-cov >=5",
  "ruff >=0.6",
  "mypy >=1.10",
  "pre-commit >=3.7",
]

[project.scripts]
zabgrab = "zabgrab.cli:main"

[project.urls]
"Source Code" = "https://github.com/SeanDS/zabgrab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zabgrab = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "PT",      # pytest style
  "C4",      # comprehensions
  "DTZ",     # naive datetimes
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dateparser", "dateparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["zabgrab"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
